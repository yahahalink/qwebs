<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星辰科技 - 欢迎页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            background: #f5f7fa;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: white;
            padding: 20px 10%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .menu a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            transition: opacity 0.3s;
        }

        .menu a:hover {
            opacity: 0.8;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            max-width: 700px;
            margin: auto;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 28px;
            background: white;
            color: #4f46e5;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .features {
            padding: 80px 10%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #4f46e5;
        }

        footer {
            background: #111827;
            color: #ddd;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 34px;
            }

            nav {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

<header>
    <nav>
        <div class="logo">星辰科技</div>
        <div class="menu">
            <a href="#">首页</a>
            <a href="#">产品</a>
            <a href="#">服务</a>
            <a href="#">联系我们</a>
        </div>
    </nav>

    <div class="hero">
        <h1>构建未来，从现在开始</h1>
        <p>
            欢迎来到星辰科技，我们致力于为企业和个人提供高效、可靠、创新的数字化解决方案。
        </p>
        <a href="#" class="btn">立即体验</a>
    </div>
</header>

<section class="features">
    <div class="card">
        <h3>🚀 高性能</h3>
        <p>采用现代化技术栈构建，确保系统稳定流畅运行。</p>
    </div>

    <div class="card">
        <h3>🔒 安全可靠</h3>
        <p>多层安全防护机制，保障数据安全与隐私。</p>
    </div>

    <div class="card">
        <h3>☁️ 云端部署</h3>
        <p>支持快速部署到云平台，轻松扩展业务规模。</p>
    </div>

    <div class="card">
        <h3>📊 数据分析</h3>
        <p>智能分析业务数据，帮助做出更精准的决策。</p>
    </div>
</section>

<footer>
    <p>© 2026 星辰科技有限公司. All Rights Reserved.</p>
</footer>

</body>
</html>
